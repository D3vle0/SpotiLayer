name: Release SpotiLayer

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows AMD64
          - os: windows
            arch: amd64
            runner: windows-latest
            ext: .exe
          # Windows ARM64
          - os: windows
            arch: arm64
            runner: ubuntu-latest
            ext: .exe
          # macOS ARM64
          - os: darwin
            arch: arm64
            runner: macos-latest
            ext: ''
          # Linux AMD64
          - os: linux
            arch: amd64
            runner: ubuntu-latest
            ext: ''
          # Linux ARM64
          - os: linux
            arch: arm64
            runner: ubuntu-latest
            ext: ''

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      # Linux AMD64 Dependencies
      - name: Install Linux AMD64 Dependencies
        if: matrix.os == 'linux' && matrix.arch == 'amd64'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libgl1-mesa-dev xorg-dev libasound2-dev

      # Linux ARM64 Dependencies (Cross compile with multiarch sources)
      - name: Install Linux ARM64 Cross-Compiler & Dependencies
        if: matrix.os == 'linux' && matrix.arch == 'arm64'
        run: |
          sudo dpkg --add-architecture arm64

          # Ubuntu 24.04 (deb822) sources isolation
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i 's/^Types: deb/Architectures: amd64\nTypes: deb/g' /etc/apt/sources.list.d/ubuntu.sources
            sudo tee /etc/apt/sources.list.d/arm64.sources << 'EOF'
Types: deb
URIs: http://ports.ubuntu.com/ubuntu-ports/
Suites: noble noble-updates noble-backports noble-security
Components: main restricted universe multiverse
Architectures: arm64
Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
EOF
          else
            sudo sed -i 's/^deb /deb [arch=amd64] /g' /etc/apt/sources.list
            sudo tee /etc/apt/sources.list.d/arm64.list << 'EOF'
deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ jammy main restricted universe multiverse
deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ jammy-updates main restricted universe multiverse
deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ jammy-security main restricted universe multiverse
EOF
          fi

          sudo apt-get update -y
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libgl1-mesa-dev:arm64 xorg-dev:arm64 libasound2-dev:arm64

      # Windows ARM64 Toolchain (llvm-mingw)
      - name: Setup llvm-mingw for Windows ARM64
        if: matrix.os == 'windows' && matrix.arch == 'arm64'
        run: |
          sudo mkdir -p /opt/llvm-mingw
          curl -sL https://github.com/mstorsjo/llvm-mingw/releases/download/20261104/llvm-mingw-20261104-ucrt-ubuntu-22.04-x86_64.tar.xz | sudo tar -xJ --strip-components=1 -C /opt/llvm-mingw
          echo "/opt/llvm-mingw/bin" >> $GITHUB_PATH

      # Build Binary
      - name: Build Binary
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          OUTPUT_NAME="SpotiLayer-${TAG}-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}"

          if [ "${{ matrix.os }}" = "windows" ] && [ "${{ matrix.arch }}" = "arm64" ]; then
            CGO_ENABLED=1 CC=aarch64-w64-mingw32-gcc GOOS=windows GOARCH=arm64 go build -ldflags="-s -w -H=windowsgui" -o "$OUTPUT_NAME" .
          elif [ "${{ matrix.os }}" = "windows" ] && [ "${{ matrix.arch }}" = "amd64" ]; then
            CGO_ENABLED=1 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w -H=windowsgui" -o "$OUTPUT_NAME" .
          elif [ "${{ matrix.os }}" = "linux" ] && [ "${{ matrix.arch }}" = "arm64" ]; then
            PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig CGO_ENABLED=1 CC=aarch64-linux-gnu-gcc GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o "$OUTPUT_NAME" .
          elif [ "${{ matrix.os }}" = "linux" ] && [ "${{ matrix.arch }}" = "amd64" ]; then
            CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o "$OUTPUT_NAME" .
          elif [ "${{ matrix.os }}" = "darwin" ]; then
            CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o "$OUTPUT_NAME" .
            cp "$OUTPUT_NAME" "SpotiLayer-${TAG}-macos-${{ matrix.arch }}${{ matrix.ext }}"
          fi

          ls -lh SpotiLayer-*

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}-${{ matrix.arch }}
          path: SpotiLayer-*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Display downloaded files
        run: ls -lh dist/

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          name: SpotiLayer ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
