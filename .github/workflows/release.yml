name: Release SpotiLayer

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows AMD64
          - os: windows
            arch: amd64
            runner: windows-latest
            ext: .exe
          # Windows ARM64
          - os: windows
            arch: arm64
            runner: ubuntu-latest
            ext: .exe
          # macOS ARM64
          - os: darwin
            arch: arm64
            runner: macos-latest
            ext: ''
          # Linux AMD64
          - os: linux
            arch: amd64
            runner: ubuntu-latest
            ext: ''
          # Linux ARM64
          - os: linux
            arch: arm64
            runner: ubuntu-latest
            ext: ''

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      # Linux AMD64 Dependencies
      - name: Install Linux AMD64 Dependencies
        if: matrix.os == 'linux' && matrix.arch == 'amd64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev libasound2-dev

      # Linux ARM64 Dependencies (Cross compile)
      - name: Install Linux ARM64 Cross-Compiler & Dependencies
        if: matrix.os == 'linux' && matrix.arch == 'arm64'
        run: |
          sudo dpkg --add-architecture arm64
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libgl1-mesa-dev:arm64 xorg-dev:arm64 libasound2-dev:arm64

      # Windows ARM64 Toolchain (llvm-mingw)
      - name: Setup llvm-mingw for Windows ARM64
        if: matrix.os == 'windows' && matrix.arch == 'arm64'
        uses: mstorsjo/setup-llvm-mingw@v1
        with:
          target-arch: aarch64

      # Build Binary
      - name: Build Binary
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          OUTPUT_NAME="SpotiLayer-${TAG}-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}"

          if [ "${{ matrix.os }}" = "windows" ] && [ "${{ matrix.arch }}" = "arm64" ]; then
            CGO_ENABLED=1 CC=aarch64-w64-mingw32-gcc GOOS=windows GOARCH=arm64 go build -ldflags="-s -w -H=windowsgui" -o "$OUTPUT_NAME" .
          elif [ "${{ matrix.os }}" = "windows" ] && [ "${{ matrix.arch }}" = "amd64" ]; then
            CGO_ENABLED=1 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w -H=windowsgui" -o "$OUTPUT_NAME" .
          elif [ "${{ matrix.os }}" = "linux" ] && [ "${{ matrix.arch }}" = "arm64" ]; then
            CGO_ENABLED=1 CC=aarch64-linux-gnu-gcc GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o "$OUTPUT_NAME" .
          elif [ "${{ matrix.os }}" = "linux" ] && [ "${{ matrix.arch }}" = "amd64" ]; then
            CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o "$OUTPUT_NAME" .
          elif [ "${{ matrix.os }}" = "darwin" ]; then
            CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o "$OUTPUT_NAME" .
            cp "$OUTPUT_NAME" "SpotiLayer-${TAG}-macos-${{ matrix.arch }}${{ matrix.ext }}"
          fi

          ls -lh SpotiLayer-*

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}-${{ matrix.arch }}
          path: SpotiLayer-*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Display downloaded files
        run: ls -lh dist/

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          name: SpotiLayer ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
