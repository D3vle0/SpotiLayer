<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpotiLayer</title>
</head>
<style>
    body {
        margin: 0;
        padding: 0;
        background-color: transparent;
        overflow: hidden;
    }

    .div {
        background-color: transparent;
        display: inline-flex;
        flex-direction: column;
        align-items: start;
        padding: 0;
        margin: 0;
    }

    .div-2 {
        border-radius: 20px;
        background-color: #d9d9d9;
        margin-bottom: 0;
        width: 400px;
        max-width: 100%;
        padding: 10px;
        box-sizing: border-box;
    }

    .div-3 {
        gap: 20px;
        display: flex;
        align-items: center;
    }

    .column {
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
    }

    .img {
        aspect-ratio: 1;
        object-fit: cover;
        object-position: center;
        width: 80px;
        height: 80px;
        overflow: hidden;
        border-radius: 16px;
        display: block;
    }

    .column-2 {
        display: flex;
        flex-direction: column;
        justify-content: center;
        line-height: normal;
        width: 270px;
        overflow: hidden;
    }

    .span {
        display: flex;
        flex-direction: column;
        width: 100%;
    }

    .text-wrapper {
        width: 270px;
        overflow: hidden;
        white-space: nowrap;
        position: relative;
    }

    .text-content {
        display: inline-block;
        white-space: nowrap;
        will-change: transform;
    }

    /* 텍스트가 넘칠 때 가장자리에 부드러운 페이드 효과 */
    .overflowing {
        mask-image: linear-gradient(to right, black calc(100% - 18px), transparent 100%);
        -webkit-mask-image: linear-gradient(to right, black calc(100% - 18px), transparent 100%);
    }

    .title-text {
        color: #000;
        font: 600 24px Inter, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
        line-height: 1.25;
    }

    .artist-text {
        color: #333;
        margin-top: 6px;
        font: 500 19px Inter, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
        line-height: 1.25;
    }
</style>
<style id="marquee-style"></style>

<body>
    <div class="div">
        <div class="div-2">
            <div class="div-3">
                <div class="column">
                    <img loading="lazy" srcset="{{.AlbumArt}}" class="img" id="img" />
                </div>
                <div class="column-2">
                    <span class="span">
                        <div class="text-wrapper title-text" id="title-wrapper">
                            <span class="text-content" id="title">{{.Title}}</span>
                        </div>
                        <div class="text-wrapper artist-text" id="artist-wrapper">
                            <span class="text-content" id="artist">{{.Artist}}</span>
                        </div>
                    </span>
                </div>
            </div>
        </div>
    </div>
</body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/js-cookie@3.0.5/dist/js.cookie.min.js"></script>
<script>
    var current_title = {{.Title}};
    var current_artist = {{.Artist}};

    // 제목과 아티스트의 스크롤을 자연스럽게 동기화(Sync)하는 함수
    function syncScrollAnimations() {
        const titleWrapper = document.getElementById("title-wrapper");
        const artistWrapper = document.getElementById("artist-wrapper");
        const titleEl = document.getElementById("title");
        const artistEl = document.getElementById("artist");
        const styleEl = document.getElementById("marquee-style");

        // 이전 애니메이션 초기화
        titleEl.style.animation = 'none';
        artistEl.style.animation = 'none';
        titleWrapper.classList.remove('overflowing');
        artistWrapper.classList.remove('overflowing');

        // 강제 리플로우
        void titleEl.offsetWidth;
        void artistEl.offsetWidth;

        const containerWidth = titleWrapper.clientWidth || 270;
        const titleWidth = titleEl.scrollWidth;
        const artistWidth = artistEl.scrollWidth;

        const titleOverflow = Math.max(0, titleWidth - containerWidth);
        const artistOverflow = Math.max(0, artistWidth - containerWidth);

        // 둘 다 넘치지 않으면 종료
        if (titleOverflow === 0 && artistOverflow === 0) {
            styleEl.innerHTML = '';
            return;
        }

        if (titleOverflow > 0) titleWrapper.classList.add('overflowing');
        if (artistOverflow > 0) artistWrapper.classList.add('overflowing');

        // 가장 긴 텍스트를 기준으로 동기화된 재생 시간(duration) 계산 (7초 ~ 13초 사이)
        const maxOverflow = Math.max(titleOverflow, artistOverflow);
        const duration = Math.max(7.5, Math.min(13, 5.5 + maxOverflow * 0.04));

        const titleDist = titleOverflow > 0 ? titleOverflow + 10 : 0;
        const artistDist = artistOverflow > 0 ? artistOverflow + 10 : 0;

        // 동기화된 키프레임 생성:
        // 0% ~ 22%: 시작 위치에서 멈춤 (앞부분을 편안하게 읽을 시간)
        // 22% ~ 58%: 부드럽게 끝으로 스크롤 (동시에 같은 페이스로 이동)
        // 58% ~ 78%: 끝 위치에서 멈춤 (끝부분을 편안하게 읽을 시간)
        // 78% ~ 100%: 부드럽게 원위치로 복귀 (동시에 시작 위치로 복귀)
        styleEl.innerHTML = `
            @keyframes syncScrollTitle {
                0%, 22% { transform: translateX(0); }
                58%, 78% { transform: translateX(-${titleDist}px); }
                100% { transform: translateX(0); }
            }
            @keyframes syncScrollArtist {
                0%, 22% { transform: translateX(0); }
                58%, 78% { transform: translateX(-${artistDist}px); }
                100% { transform: translateX(0); }
            }
        `;

        // 동일한 duration과 timing function으로 동시에 애니메이션 적용
        const animStyle = `${duration}s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite`;

        if (titleOverflow > 0) {
            titleEl.style.animation = `syncScrollTitle ${animStyle}`;
        }
        if (artistOverflow > 0) {
            artistEl.style.animation = `syncScrollArtist ${animStyle}`;
        }
    }

    // 폰트 렌더링 완료 후 초기 스크롤 설정
    window.addEventListener("DOMContentLoaded", function () {
        setTimeout(syncScrollAnimations, 100);
    });

    // 10초마다 Spotify 재생 상태 폴링
    setInterval(function () {
        $.ajax({
            url: 'https://api.spotify.com/v1/me/player/currently-playing',
            crossDomain: true,
            headers: {
                'Authorization': `Bearer ${Cookies.get('token')}`
            },
            statusCode: {
                401: function () {
                    window.location.reload(); // refresh token
                }
            }
        }).done(function (response) {
            let res = response;
            if (!res || !res.item) {
                return;
            }

            let newTitle = res.item.name || '';
            let artists = [];
            if (res.item.artists) {
                for (let i = 0; i < res.item.artists.length; i++) {
                    artists.push(res.item.artists[i].name);
                }
            }
            let newArtist = artists.join(', ');

            let changed = false;
            if (current_title !== newTitle) {
                document.getElementById('title').innerText = newTitle;
                current_title = newTitle;
                changed = true;
            }

            if (current_artist !== newArtist) {
                document.getElementById('artist').innerText = newArtist;
                current_artist = newArtist;
                changed = true;
            }

            // 곡이나 아티스트가 바뀌었으면 애니메이션 다시 계산 및 동기화
            if (changed) {
                syncScrollAnimations();
            }

            if (res.item.album && res.item.album.images && res.item.album.images.length > 0) {
                document.getElementById('img').srcset = res.item.album.images[0].url;
            }
        });
    }, 10000);
</script>

</html>
