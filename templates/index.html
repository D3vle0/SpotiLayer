<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpotiLayer</title>
</head>
<style>
    body {
        margin: 0;
        padding: 0;
        background-color: transparent;
        overflow: hidden;
    }

    .div {
        background-color: transparent;
        display: inline-flex;
        flex-direction: column;
        align-items: start;
        padding: 0;
        margin: 0;
    }

    @media (max-width: 400px) {
        .div {
            padding-right: 0;
        }
    }

    .div-2 {
        border-radius: 20px;
        background-color: #d9d9d9;
        margin-bottom: 0;
        width: 400px;
        max-width: 100%;
        padding: 10px 10px 10px 10px;
    }

    @media (max-width: 400px) {
        .div-2 {
            padding-left: 20px;
            margin-bottom: 40px;
        }
    }

    .div-3 {
        gap: 20px;
        display: flex;
    }

    @media (max-width: 400px) {
        .div-3 {
            flex-direction: column;
            align-items: stretch;
            gap: 0px;
        }
    }

    .column {
        display: flex;
        flex-direction: column;
        line-height: normal;
        width: 19%;
        margin-left: 0px;
    }

    @media (max-width: 400px) {
        .column {
            width: 100%;
        }
    }

    .img {
        aspect-ratio: 1;
        object-fit: contain;
        object-position: center;
        width: 80px;
        overflow: hidden;
        max-width: 100%;
        border-radius: 20px;
    }

    @media (max-width: 400px) {
        .img {
            margin-top: 35px;
        }
    }

    .column-2 {
        display: flex;
        flex-direction: column;
        line-height: normal;
        width: 280px;
        margin-left: 0px;
        overflow-x: hidden;
    }

    @media (max-width: 400px) {
        .column-2 {
            width: 100%;
        }
    }

    .span {
        z-index: 1;
        display: flex;
        flex-direction: column;
        margin: auto 0;
        white-space: nowrap;
        will-change: transform;
    }

    @media (max-width: 400px) {
        .span {
            margin-top: 40px;
        }
    }

    .div-4 {
        color: #000;
        white-space: nowrap;
        font: 600 24px Inter, sans-serif;
    }

    @media (max-width: 400px) {
        .div-4 {
            white-space: initial;
        }
    }

    .div-5 {
        color: #000;
        margin-top: 11px;
        font: 500 20px Inter, sans-serif;
    }

    .marquee,
    .marquee2 {
        overflow: hidden;
    }
</style>

<body>
    <div class="div">
        <div class="div-2">
            <div class="div-3">
                <div class="column">
                    <img loading="lazy" srcset="{{.AlbumArt}}" class="img" id="img" />
                </div>
                <div class="column-2">
                    <span class="span">
                        <div class="div-4 marquee" id="title">{{.Title}}</div>
                        <div class="div-5 marquee2" id="artist">{{.Artist}}</div>
                    </span>
                </div>
            </div>
        </div>
        <canvas id="myCanvas" width="300" height="150" style="border:1px solid grey;display: none"></canvas>
    </div>

</body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/js-cookie@3.0.5/dist/js.cookie.min.js"></script>
<script> // 텍스트 width에 따라서 marquee 여부 결정
    function getTextWidth(txt, type) {
        const c = document.getElementById("myCanvas");
        const ctx = c.getContext("2d");
        if (type === 'title')
            ctx.font = "600 24px Inter, sans-serif";
        else if (type === 'artist')
            ctx.font = "500 20px Inter, sans-serif";
        ctx.fillText("width:" + ctx.measureText(txt).width, 10, 50);
        ctx.fillText(txt, 10, 100);
        console.log(ctx.measureText(txt).width)
        return ctx.measureText(txt).width;
    }

    var current_title = {{.Title}};
    var current_artist = {{.Artist}};
    if (getTextWidth(current_title, 'title') > 280)
        document.getElementById('title').innerHTML = `<marquee>${current_title}</marquee>`
    if (getTextWidth(current_artist, 'artist') > 280)
        document.getElementById('artist').innerHTML = `<marquee>${current_artist}</marquee>`
    const interval = setInterval(function () {
        getTextWidth(current_title, 'title');
        getTextWidth(current_artist, 'artist');
        $.ajax({
            url: 'https://api.spotify.com/v1/me/player/currently-playing',
            crossDomain: true,
            headers: {
                'Authorization': `Bearer ${Cookies.get('token')}`
            },
            statusCode: {
                401: function () {
                    window.location.reload(); //refresh token
                }
            }
        }).done(function (response, textStatus, xhr) {
            console.log(response)
            let res = response;
            if (!res || !res.item) {
                return;
            }
            console.log(xhr.status)
            console.log(document.getElementById('title').innerText)
            console.log(res['item']['name'])
            if (current_title !== res['item']['name']) { // 노래 바뀜
                document.getElementById('title').innerText = res['item']['name'];
                current_title = res['item']['name'];
                if (getTextWidth(current_title, 'title') > 280) // 노래가 바뀌고 새 marquee 효과
                    document.getElementById('title').innerHTML = `<marquee>${current_title}</marquee>`
            }
            let artist = '';
            for (let i = 0; i < res['item']['artists'].length; i++)
                artist += `${res['item']['artists'][i]['name']}, `;
            artist = artist.slice(0, -2);
            if (current_artist !== artist) {
                document.getElementById('artist').innerText = artist;
                current_artist = artist;
                if (getTextWidth(current_artist, 'artist') > 280)
                    document.getElementById('artist').innerHTML = `<marquee>${current_artist}</marquee>`
            }
            if (res['item']['album'] && res['item']['album']['images'] && res['item']['album']['images'].length > 0) {
                document.getElementById('img').srcset = res['item']['album']['images'][0]['url'];
            }
        });
    }, 10000);
</script>

</html>
